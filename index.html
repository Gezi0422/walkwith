<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WALKWITH Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;600&display=swap">
<style>
/* Layout: two live phones (blind port, volunteer port) side by side, driven by one shared state; a swimlane flow tracker on the right mirrors the core cross-device flow. */
:root{
  --page:#ECEEF4; --panel:#FFFFFF; --ink:#11131A; --muted:#5D6375; --line:#D8DCE6;
  --brand:#1446D8; --brand-deep:#0B2A8C; --navy:#0A1C63; --brand-soft:#E3EAFE;
  --sys:#8A90A0; --ok:#1C8C55; --warn:#C2410C; --sos:#D92D20;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Noto Sans SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0C0F1A; --panel:#151A2B; --ink:#E9ECF5; --muted:#9AA2B8; --line:#2A3148; --brand-soft:#1B2A5C; --sys:#8C93A8; color-scheme:dark}}
:root[data-theme="dark"]{--page:#0C0F1A; --panel:#151A2B; --ink:#E9ECF5; --muted:#9AA2B8; --line:#2A3148; --brand-soft:#1B2A5C; --sys:#8C93A8; color-scheme:dark}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--f-body);padding:24px 16px 48px}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7AA2FF;outline-offset:2px}

/* ---------- page chrome ---------- */
.top{max-width:1240px;margin:0 auto 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.02em;margin:0;line-height:1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.hint{max-width:1240px;margin:0 auto 20px;display:flex;gap:10px;align-items:center;background:var(--brand-soft);border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.5}
.hint b{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;color:var(--brand);white-space:nowrap}
:root:not([data-theme="light"]) .hint b{color:inherit}
.stage{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:auto auto minmax(260px,1fr);gap:28px;align-items:start;justify-content:center}
@media (max-width:1100px){.stage{grid-template-columns:auto auto}.flow{grid-column:1/-1}}
@media (max-width:760px){.stage{grid-template-columns:1fr;justify-items:center}}
.col{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
.col-h{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%}

/* ---------- phone ---------- */
.phone{width:340px;max-width:100%;height:720px;border-radius:48px;background:#0E0F14;padding:10px;box-shadow:0 30px 60px -30px rgba(10,20,60,.45)}
.phone.buzz{animation:buzz .35s}
@keyframes buzz{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:#fff;color:#11131A}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:20px;background:#0E0F14;z-index:30}
.sbar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:700;z-index:29;pointer-events:none}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:4px;background:currentColor;opacity:.5;z-index:29;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:50px 18px 22px}
.blue{background-color:#1446D8;background-size:cover;background-position:center;color:#fff}
.white{background:#fff;color:#11131A}

.tabs{margin-top:auto;display:flex;justify-content:space-around;align-items:center;height:54px;border-radius:28px;background:#0A1C63;color:#fff;flex-shrink:0}
.tabs.dark{background:#16171C}
.vtabs{position:absolute;left:18px;right:18px;bottom:22px;z-index:24;margin:0}
#vol .scr{padding-bottom:88px}
.tabs button{width:52px;height:44px;display:grid;place-items:center;border-radius:22px;opacity:.75}
.tabs button.act{opacity:1;color:#7FA3FF}
.tabs button.act::after{content:"";position:absolute}

/* blind */
.b-title{font-family:var(--f-display);font-size:20px;font-weight:700;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px;scrollbar-width:none}
.chat::-webkit-scrollbar{display:none}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:800;background:#fff;color:#1446D8;border:2px solid #fff}
.msg.me .av{background:#F3C6A8;color:#7A3B16}
.bub{background:#fff;color:#11131A;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.45;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.msg.me .bub{border-bottom-right-radius:3px}
.msg.w .bub{border-bottom-left-radius:3px}
.typing span{display:inline-block;width:5px;height:5px;margin:0 1.5px;border-radius:50%;background:#1446D8;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 12px}
.mic{width:92px;height:92px;border-radius:50%;background:#fff;color:#1446D8;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,255,255,.18)}
.mic.on{animation:pulse 1s infinite}
.mic:disabled{opacity:.55;cursor:default}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 26px rgba(255,255,255,0)}}
.micwrap p{margin:0;font-size:12px;opacity:.85}
.linkbtn{color:#fff;text-decoration:underline;font-size:11.5px;opacity:.9}
.say{display:flex;gap:8px;margin-top:6px}
.say input{flex:1;min-width:0;height:42px;border-radius:21px;border:0;padding:0 14px;font:inherit;font-size:16px;color:#11131A;background:#fff}
.say button{width:42px;height:42px;border-radius:50%;background:#0A1C63;color:#fff;display:grid;place-items:center;flex-shrink:0}
.sayrow{display:flex;justify-content:space-between;margin-top:6px}
.sayrow button{color:#fff;text-decoration:underline;font-size:11.5px;opacity:.9}
.msg.me.interim .bub{opacity:.7;font-style:italic}
.caption{position:absolute;left:14px;right:14px;bottom:86px;z-index:20;background:rgba(6,14,50,.92);color:#fff;border-radius:12px;padding:9px 12px;font-size:12px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.caption.trip{bottom:24px}
.caption svg{flex-shrink:0;margin-top:1px;color:#7FA3FF}

.card-navy{background:#0A1C63;border-radius:22px;padding:18px;color:#fff}
.vlabel{font-size:13px;opacity:.8;font-weight:600}
.vnum{font-family:var(--f-display);font-weight:800;font-size:46px;letter-spacing:.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.vname{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.1}
.callbtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.tl{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.tl li{position:relative;padding:0 0 14px 20px;font-size:12.5px;opacity:.5}
.tl li::before{content:"";position:absolute;left:3px;top:4px;width:7px;height:7px;border-radius:50%;background:currentColor}
.tl li::after{content:"";position:absolute;left:6px;top:14px;bottom:2px;border-left:1.5px dotted currentColor}
.tl li:last-child::after{display:none}
.tl li.done{opacity:.8}
.tl li.now{opacity:1;font-weight:700}
.tl li.now::before{background:#7FA3FF;box-shadow:0 0 0 4px rgba(127,163,255,.3)}
.tl small{display:block;font-weight:400;opacity:.8;margin-top:2px}
.codebox{display:flex;gap:6px;margin-top:8px}
.codebox span{width:38px;height:44px;border-radius:8px;background:#fff;color:#0A1C63;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:22px;font-weight:700;font-size:14px;width:100%}
.btn.black{background:#11131A;color:#fff}
.btn.white{background:#fff;color:#0A1C63}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.btn.line{border:1.5px solid #11131A;color:#11131A}
.btn.gmaps{background:#fff;color:#0A1C63;text-decoration:none;height:40px;font-size:13px;border:2px solid #7FA3FF}
a.btn{text-decoration:none}
.btn.sm{height:36px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.sos{width:46px;height:46px;border-radius:50%;background:#D92D20;color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;letter-spacing:.04em}

/* overlays */
.ov{position:absolute;inset:0;z-index:25;background:rgba(10,14,30,.55);display:flex;align-items:center;justify-content:center;padding:26px}
.modal{background:#fff;color:#11131A;border-radius:20px;padding:22px 20px 18px;width:100%;text-align:center;position:relative;display:flex;flex-direction:column;gap:10px}
.modal h3{margin:0;font-family:var(--f-display);font-size:17px}
.modal p{margin:0;font-size:12.5px;color:#4B5163;line-height:1.5}
.modal .x{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:#1446D8;color:#fff;display:grid;place-items:center}
.modal .big{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.18em;color:#0A1C63;font-variant-numeric:tabular-nums}
.modal .ico{color:#1446D8;display:flex;justify-content:center}
.spin{width:38px;height:38px;margin:4px auto;border-radius:50%;border:4px solid #D7E0FB;border-top-color:#1446D8;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.req{text-align:left;display:flex;flex-direction:column;gap:2px;padding-left:14px;border-left:2px solid #11131A;margin:4px 0 6px}
.req small{font-size:11px;color:#4B5163}
.req strong{font-family:var(--f-display);font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.req em{font-style:normal;font-size:11px;color:#1446D8;font-weight:700;margin-bottom:6px}
.pill{display:inline-block;padding:2px 7px;border-radius:999px;background:#1446D8;color:#fff;font-size:10px;font-weight:700;font-family:var(--f-body);letter-spacing:0}
.pill.dark{background:#11131A}
.note{background:#E3EAFE;color:#0B2A8C;border-radius:10px;padding:8px 10px;font-size:11.5px;text-align:left;line-height:1.45}

/* volunteer */
.v-head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px}
.v-head h2{margin:0;font-family:var(--f-display);font-size:18px}
.v-icons{display:flex;gap:10px;color:inherit;opacity:.8}
.relay-tag{position:absolute;top:44px;left:12px;right:12px;z-index:22;background:#FFE7C2;color:#7A3D00;border-radius:10px;font-size:11px;font-weight:700;padding:6px 10px;text-align:center}
.logo-sm{display:flex;flex-direction:column;gap:4px;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.04em}
.vcard{background:#1446D8;color:#fff;border-radius:18px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.vcard h3{margin:0;font-family:var(--f-display);font-size:26px}
.vcard p{margin:0;font-size:11.5px;opacity:.85}
.seg{display:flex;justify-content:center;gap:10px;margin-top:10px}
.seg button{padding:6px 16px;border-radius:999px;background:#0A1C63;color:#fff;font-size:12px;font-weight:700;opacity:.55}
.seg button.act{opacity:1;background:#11131A}
.tasks{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:none;padding-bottom:8px}
.trow{display:grid;grid-template-columns:44px 1fr;gap:6px}
.trow .when{font-size:11px;color:#5D6375;padding-top:12px;font-weight:600}
.tcard{background:#F2F3F7;border-radius:14px;padding:10px 12px;font-size:11px;color:#5D6375;display:flex;flex-direction:column;gap:2px;text-align:left;width:100%}
.tcard.live{background:#E3EAFE;outline:2px solid #1446D8}
.tcard b{font-size:13.5px;color:#11131A;display:flex;justify-content:space-between;align-items:center;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#1446D8;color:#fff;border-radius:12px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:10px}
.stat b{font-size:13px}
.list{display:flex;flex-direction:column;gap:6px}
.list h4{margin:10px 0 2px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;background:#F2F3F7;border-radius:10px;padding:10px 12px;font-size:12px;color:#3B4152;width:100%;text-align:left}
.ptop{background:#1446D8;color:#fff;margin:-50px -18px 0;padding:56px 18px 18px;background-size:cover}
.ptop h2{font-family:var(--f-display);font-size:26px;margin:4px 0 8px}
.pts{display:flex;gap:16px;align-items:center;font-size:12px}
.pts b{font-size:16px;font-variant-numeric:tabular-nums}
.pts .xbtn{margin-left:auto;background:#11131A;color:#fff;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700}
.sheet{background:#fff;color:#11131A;border-radius:22px 22px 0 0;margin:auto -18px -22px;padding:18px 18px 26px;display:flex;flex-direction:column;gap:10px}
.radio{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:8px 2px;border-bottom:1px solid #ECEEF3;width:100%}
.radio small{display:block;font-size:10.5px;color:#5D6375;margin-top:2px}
.radio .r{width:18px;height:18px;border-radius:50%;border:2px solid #1446D8;flex-shrink:0;display:grid;place-items:center}
.radio.act .r::after{content:"";width:8px;height:8px;border-radius:50%;background:#1446D8}
.codein{display:flex;gap:8px;justify-content:center}
.codein span{width:50px;height:56px;border-radius:8px;background:#ECEEF3;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px}
.codein span.cur{outline:2px solid #1446D8}
.codein.bad span{background:#FDE3E1;animation:buzz .35s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#D3D6DE;margin:auto -18px 0;padding:8px}
.pad button{background:#fff;border-radius:6px;height:40px;font-size:20px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pad button small{font-size:8px;font-weight:700;letter-spacing:.1em;margin-top:2px}
.pad button.blank{background:transparent;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:11.5px;font-weight:700;color:#3B4152}
.field select,.field input{height:38px;border-radius:8px;border:1px solid #CDD1DB;padding:0 10px;font:inherit;font-weight:500;font-size:13px;background:#fff;color:#11131A}
.toast{position:absolute;top:50px;left:12px;right:12px;z-index:28;background:#11131A;color:#fff;border-radius:14px;padding:10px 12px;font-size:12px;display:flex;gap:10px;align-items:center;animation:drop .3s ease-out}
.toast b{display:block;font-size:13px}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
.qty{display:flex;justify-content:center;align-items:center;gap:16px;font-size:20px;font-weight:800}
.qty button{width:34px;height:34px;border-radius:50%;background:#ECEEF3;font-size:18px}
.dist{display:flex;gap:16px;font-size:12px;margin-top:8px;opacity:.85}
.dist b{font-size:18px;display:block}

/* flow panel */
.flow{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;width:100%}
.flow h3{margin:0;font-family:var(--f-display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.flow h3 .pill{font-size:11px;letter-spacing:0;text-transform:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:6px 0;color:var(--muted);font-size:12.5px;position:relative}
.steps li .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--panel)}
.steps li b{display:block;font-size:12px;letter-spacing:.06em;color:var(--ink);opacity:.55}
.steps li.done .n{background:var(--lane);border-color:var(--lane);color:#fff}
.steps li.done b{opacity:.85}
.steps li.now .n{border-color:var(--lane);border-width:2.5px;color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--lane) 25%,transparent)}
.steps li.now b{opacity:1}
.steps li.now{color:var(--ink)}
.lane{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--lane);margin-left:6px}
.log{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
.log div{font-size:11.5px;color:var(--muted);display:grid;grid-template-columns:62px 1fr;gap:8px;line-height:1.4}
.log div span:first-child{font-weight:700;color:var(--ink);font-size:10.5px;letter-spacing:.06em}
.mech{font-size:12px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line);padding-top:12px}
.mech b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="brand">
    <span id="logo"></span>
    <div><h1>WALKWITH</h1><p>Walk with you, every step. · 可交互原型：左边盲人端，右边志愿者端，两台手机实时联动</p></div>
  </div>
  <div class="ctrls">
    <button class="chip on" id="audioBtn" data-a="toggleAudio"></button>
    <button class="chip" data-a="reset">重新开始</button>
  </div>
</header>
<div class="hint" role="status" aria-live="polite"><b>NEXT</b><span id="hint"></span></div>

<main class="stage">
  <section class="col">
    <div class="col-h"><span class="dot" style="background:#1446D8"></span>A · Blind port · Miss Liu</div>
    <div class="phone" id="pB"><div class="screen"><div class="notch"></div><div class="sbar"><span>9:41</span><span>5G ▮</span></div><div id="blind"></div><div class="homebar"></div></div></div>
  </section>
  <section class="col">
    <div class="col-h"><span class="dot" style="background:#11131A;outline:1px solid #888"></span>B · Volunteer port · <span id="vwho">Junge</span></div>
    <div class="phone" id="pV"><div class="screen"><div class="notch"></div><div class="sbar" id="vsbar"><span>9:41</span><span>5G ▮</span></div><div id="vol"></div><div class="homebar" id="vhb"></div></div></div>
  </section>
  <aside class="flow" id="flow"></aside>
</main>

<script>
/* ---------------- icons ---------------- */
const P={
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',

  speak(`Verification successful. Your volunteer is ${vol().name}.`);S.hint='盲人端显示志愿者真实姓名，点 Confirm 开始行程。'},
 vNext(){const t=S.trip;if(S.b.phase!=='guiding'){S.hint='请先在盲人端点 Confirm，确认志愿者身份。';return}
  if(S.v.step<t.steps.length-1){S.v.step++;speak(t.steps[S.v.step]+'.');buzz('pB');S.flow=9}},
 vArrive(){const t=S.trip;S.flow=10;
  if(t.mode==='relay'&&t.stage===0){S.v.away=false;S.v.screen='mark';S.hint='接力模式：在结束前标记盲人所在的站台和车门号，方便下一位志愿者接人。'}
  else endTrip()},
 vMark(){const f=document.getElementById('mStation'),d=document.getElementById('mDoor');S.v.mark={station:f.value,door:d.value||'12'};
  log('VOL',`Location marked: ${S.v.mark.station} · ${S.trip.rt.stages[1].line} platform · door ${S.v.mark.door}`);endTrip()},
 vFinish(){S.v.away=false;S.v.screen='tabs';S.v.tab='home';S.v.toast={t:`+${S.trip.reward} points`,s:`Thanks for walking with Miss Liu. Points are added to your account.`};S.flow=12;
  later(4200,()=>{S.v.toast=null});
  if(S.trip.mode==='relay'&&S.trip.stage===0)S.hint='在盲人端点 “Begin Trip B”，系统会为第二段重新匹配志愿者 B。';
  else if(S.b.ov==='complete')S.hint='在盲人端点 Done 结束行程。';},
 vExch(){S.v.exch=!S.v.exch;S.v.qty=1},
 vQty(d){S.v.qty=Math.max(1,Math.min(Math.floor(S.points/100)||1,S.v.qty+ +d))},
 vExchOk(){const c=S.v.qty*100;if(S.points<c)return;S.points-=c;S.tickets+=S.v.qty;log('VOL',`Exchanged ${c} points for ${S.v.qty} metro ticket(s)`);S.v.exch=false;S.v.toast={t:`${S.v.qty} metro ticket${S.v.qty>1?'s':''} added`,s:'Show the QR code at any metro gate.'};later(3500,()=>{S.v.toast=null})},
};
function openType(){S.b.typeOpen=true;
  S.hint=srBlocked?'当前页面无法直接使用麦克风。点盲人端的输入框，再点手机键盘上的麦克风键，用系统听写说出目的地，然后点发送。':'在输入框里输入，或用手机键盘上的麦克风听写。';
  later(60,()=>{const i=document.getElementById('bInput');if(i)i.focus()})}
function hear(t){const b=S.b;b.chat.push({me:1,t});b.typing=true;
  if(b.vstep===0){const rt=parseRoute(t);
    later(700,()=>{b.typing=false;
      if(!rt){const m='Sorry, I couldn’t find a station in that. Try: “From KTH to Fridhemsplan”.';b.chat.push({w:1,t:m});speak(m);S.hint='没有识别到车站名。可以说 “From KTH to Fridhemsplan” 或 “Take me to Gamla stan”。';return}
      S.pending=rt;S.flow=0;log('BLIND','Voice request: '+rt.from+' → '+rt.to);
      const m=`The best route has been planned: from ${rt.from}, take the ${rt.stages[0].line} towards ${rt.stages[0].b}${rt.stages.length>1?`, then change to the ${rt.stages[1].line} to ${rt.to}`:''}. Confirmed or modified?`;
      b.chat.push({w:1,t:m});speak(m);b.vstep=1;S.hint='回答 “Confirmed” 确认路线，或说 “No” 重新说目的地。'});
  }else{const n=' '+norm(t)+' ';
    if(/ (no|nope|change|modify|wrong|cancel) /.test(n)){later(500,()=>{b.typing=false;b.vstep=0;S.pending=null;const m='Okay. Where would you like to go?';b.chat.push({w:1,t:m});speak(m);S.hint='重新说出起点和终点。'})}
    else if(/ (yes|yeah|yep|confirm|confirmed|ok|okay|sure|correct|right|go) /.test(n)){later(700,()=>{b.typing=false;const m='The assignment has been posted and is matching you with a volunteer…';b.chat.push({w:1,t:m});speak(m);b.vstep=2;b.typeOpen=false;startMatch(S.pending)})}
    else later(500,()=>{b.typing=false;const m='Please say “Confirmed” to book this route, or “No” to change it.';b.chat.push({w:1,t:m});speak(m)});
  }}
function startMatch(rt,relayB){
  if(!relayB){S.trip={rt,stage:0,mode:null,steps:[],reward:0};S.who=0}
  S.trip.relayB=!!relayB;S.b.ov='matching';S.flow=1;log('SYSTEM','Searching volunteers within 1 km of '+(relayB?S.v.mark.station:rt.from));
  S.v.away=false;S.v.screen='tabs';S.v.tab='tasks';S.hint='系统正在匹配志愿者……';
  later(1700,()=>{S.v.popup=true;S.flow=2;buzz('pV');log('SYSTEM','Task pushed to '+vol().name);S.hint=relayB?'现在右边是志愿者 B 的手机。任务里带有上一位志愿者标记的站台与车门号，点 Accept。':'志愿者端弹出求助任务。点 Accept 接单（或 Cancel 看拒绝的情况）。'});
}
function matched(){
  const t=S.trip,rt=t.rt;S.v.route=S.v.route||'full';
  t.steps=t.mode==='single'?(rt.stages.length>1?[...stageSteps(rt,0),...stageSteps(rt,1)]:stageSteps(rt,0)):stageSteps(rt,t.stage);
  S.flow=3;log('SYSTEM',`Match success. Dynamic Service ID ${vol().code} generated for ${vol().name}`);
  S.v.away=false;S.v.screen='nav';S.b.ov='matched';buzz('pB');
  later(500,()=>{if(S.flow<4)S.flow=4;speak(`Match made! Your volunteer number is ${vol().code}. Your volunteer is on the way.`)});
  S.hint='盲人端听到“匹配成功”和志愿者编号。点盲人端的 Confirm。';
}
function endTrip(){
  const t=S.trip;t.reward=t.mode==='single'?30:15;S.flow=11;
  if(S.who===0){S.points+=t.reward;S.services++;S.history.unshift(`${t.mode==='single'?rt0(t):t.rt.stages[t.stage].a+' → '+t.rt.stages[t.stage].b} · +${t.reward}`)}
  log('SYSTEM',`End trip. Reward calculated: +${t.reward} points for ${vol().name}`);
  S.v.away=false;S.v.screen='done';
  const last=t.mode==='single'||t.stage===1;
  S.b.ov='complete';buzz('pB');
  speak(last?`You have arrived at ${t.rt.to} station. Trip complete. Thank you for walking with ${vol().name}.`:`Trip A complete. ${vol().name} has marked your location: ${S.v.mark.station}, ${t.rt.stages[1].line} platform, door ${S.v.mark.door}. The next volunteer will meet you here.`);
  S.hint='志愿者端点 Finish，查看积分通知。';
}
const rt0=t=>t.rt.from+' → '+t.rt.to;

       ${R('full','Full Route',`${t.rt.from} to ${t.rt.to}`,'')}
       <button class="btn black sm" data-a="vRouteOk">Confirm</button></div></div>`}
  }else if(v.screen==='nav'||v.screen==='guide'){
    const g=v.screen==='guide',last=v.step>=t.steps.length-1;
    h=`<div class="scr blue" style="background-image:${MAP.blueR}">
     <div class="b-title" style="color:#fff">${g?'Trip in progress':'Navigation to passenger'}</div><div style="flex:1"></div>
     <div class="card-navy">
      <div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="vlabel">Passenger</div><div class="vname">Miss Liu</div></div><button class="callbtn" aria-label="Call passenger">${ic('phone',20)}</button></div>
      ${g?`<ul class="tl" style="max-height:200px;overflow:auto">${t.steps.map((s,i)=>`<li class="${i<v.step?'done':i===v.step?'now':''}">${s}</li>`).join('')}</ul>
       <div style="margin-top:8px;display:flex;flex-direction:column;gap:8px">${gBtn(gTransit(t.mode==='single'?t.rt.from:t.rt.stages[t.stage].a,t.mode==='single'?t.rt.to:t.rt.stages[t.stage].b),'Open route in Google Maps')}${last?`<button class="btn white" data-a="vArrive">${ic('flag',18)} ${t.mode==='relay'&&t.stage===0?'Mark location & finish stage':'Arrive · complete service'}</button>`:`<button class="btn white" data-a="vNext">Next: ${t.steps[v.step+1]}</button>`}</div>`
      :`<div class="dist"><div><b>120 m</b>distance</div><div><b>2 min</b>walking</div><div><b>${S.trip.relayB?v.mark.station:t.rt.from}</b>${S.trip.relayB?'door '+v.mark.door:t.rt.fromExit}</div></div>
       <ul class="tl"><li class="now">On the way</li><li>Code Verify</li><li>Verify Success</li></ul>
       ${gBtn(gWalk(S.trip.relayB?v.mark.station:t.rt.from),'Navigate in Google Maps')}
       <button class="btn white" data-a="vArrived" style="margin-top:8px">${ic('pin',18)} I’ve arrived · verify passenger</button>`}
     </div></div>`;
  }else if(v.screen==='verify'){
    const keys=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ']];
    h=`<div class="scr blue">
     <div class="b-title" style="justify-content:flex-start;gap:8px;font-size:17px;margin-bottom:16px"><span>${ic('back',18)}</span>Verify Volunteer Identity</div>
     <div class="sheet" style="margin:0 -18px -88px;border-radius:22px 22px 0 0;flex:1;gap:12px;padding-bottom:88px">
      <p style="margin:0;font-size:12px;font-weight:700">Enter the volunteer code</p>
      <p style="margin:-8px 0 0;font-size:11px;color:#5D6375">Ask the passenger to tell you the 4-digit code on their phone.</p>
      <div class="codein ${v.bad?'bad':''}">${[0,1,2,3].map(i=>`<span class="${i===v.entered.length?'cur':''}">${v.entered[i]||''}</span>`).join('')}</div>
      <button style="align-self:flex-end;color:#1446D8;font-size:11px;font-weight:700" data-a="vResend">Resend</button>
      ${v.bad?`<p style="margin:-10px 0 0;font-size:11.5px;color:#D92D20">The code doesn’t match. Ask the passenger again.</p>`:''}
      <button class="btn black" data-a="vVerify" ${v.entered.length<4?'disabled':''}>Confirm</button>
      <div class="pad">${keys.map(([k,s])=>`<button data-a="vKey" data-v="${k}">${k}<small>${s}</small></button>`).join('')}<button class="blank" tabindex="-1"></button><button data-a="vKey" data-v="0">0</button><button data-a="vKey" data-v="del" aria-label="Delete" style="background:transparent">${ic('del',22)}</button></div>
     </div></div>`;
  }else if(v.screen==='mark'){
    h=`<div class="scr blue" style="background-image:${MAP.blueR}"><div class="ov"><div class="modal">
      <div class="ico">${ic('pin',30)}</div><h3>Mark Location</h3><p>Mark where you leave the passenger so the next volunteer can find them easily.</p>
      <label class="field">Station<select id="mStation">${[...new Set([t.rt.stages[0].b,'T-Centralen','Gamla stan'])].map(o=>`<option>${o}</option>`).join('')}</select></label>
      <label class="field">Metro Platform Number (door)<input id="mDoor" inputmode="numeric" value="${v.mark.door}"></label>
      <button class="btn black sm" data-a="vMark">Submit</button></div></div></div>`;
  }else if(v.screen==='done'){
    h=`<div class="scr blue" style="background-image:${MAP.blueR}"><div class="ov"><div class="modal">
      <div class="ico">${ic('flag',30)}</div><h3>Route Complete</h3><p>${t.mode==='relay'?`Stage ${t.stage+1}: ${t.rt.stages[t.stage].a} → ${t.rt.stages[t.stage].b}`:`${t.rt.from} → ${t.rt.to}`}</p>
      <div class="big" style="letter-spacing:0;font-size:30px">+${t.reward}<span style="font-size:14px"> points</span></div>
      <button class="btn black sm" data-a="vFinish">Finish</button></div></div></div>`;
  }
  h+=vTabs();
  if(S.who===1)h+=`<div class="relay-tag">Relay · now showing Volunteer B’s phone (Chen Hao)</div>`;
  if(v.exch){h+=`<div class="ov"><div class="modal"><button class="x" data-a="vExch" aria-label="Close">${ic('x',14,3)}</button><div class="ico">${ic('coins',30)}</div><h3>${S.points} Points</h3>
    <div class="row"><span>Single Ticket</span><b>100 points</b></div><p>Quantity</p><div class="qty"><button data-a="vQty" data-v="-1">−</button><span>${v.qty}</span><button data-a="vQty" data-v="1">+</button></div>
    <button class="btn black sm" data-a="vExchOk" ${S.points<v.qty*100?'disabled':''}>Exchange</button></div></div>`}
  if(v.toast)h+=`<div class="toast">${ic('gift',24)}<div><b>${v.toast.t}</b>${v.toast.s}</div></div>`;
  return h;
}

/* ---------------- render: flow ---------------- */
function renderFlow(){
  const t=S.trip;
  const badge=t?(t.mode==='relay'?`Relay · Trip ${t.stage?'B':'A'}`:t.mode==='single'?'One volunteer':'Matching'):'Idle';
  return `<h3>Core cross-device flow <span class="pill">${badge}</span></h3>
   <div class="legend">${['b','s','v'].map(k=>`<span><i class="dot" style="background:${LANE[k][0]}"></i>${LANE[k][1]}</span>`).join('')}</div>
   <ol class="steps">${FLOW.map(([l,n,d],i)=>`<li class="${i<S.flow||S.flow===12&&i===12?'done':i===S.flow?'now':''}" style="--lane:${LANE[l][0]}"><span class="n">${i+1}</span><span><b>${n}<span class="lane">${LANE[l][1]}</span></b>${d}</span></li>`).join('')}</ol>
   <div class="mech"><b>Volunteer verification.</b> The system issues a temporary Dynamic Service ID per trip. The blind user tells it to the volunteer; once it matches, the number on the blind user’s phone becomes the volunteer’s registered name.</div>
   <div class="log" aria-label="System log">${S.log.length?S.log.map(([w,t])=>`<div><span>${w}</span><span>${t}</span></div>`).join(''):'<div><span>LOG</span><span>Events from both phones and the backend appear here.</span></div>'}</div>`;
}

function render(){
  const bi=document.getElementById('bInput'),keep=bi?bi.value:'',foc=bi&&document.activeElement===bi;
  document.getElementById('blind').innerHTML=renderBlind();
  document.getElementById('vol').innerHTML=renderVol();
  document.getElementById('flow').innerHTML=renderFlow();
  document.getElementById('hint').textContent=S.hint;
  document.getElementById('vwho').textContent=vol().name;
  const vTabView=S.v.screen==='tabs'||S.v.screen==='route'||S.v.away;const darkTop=!vTabView||S.v.tab==='me';
  document.getElementById('vsbar').style.color=darkTop?'#fff':'#11131A';
  document.getElementById('vhb').style.color=vTabView||S.v.screen==='verify'?'#11131A':'#fff';
  const ni=document.getElementById('bInput');if(ni){ni.value=keep;if(foc)ni.focus()}
  const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;
  const ab=document.getElementById('audioBtn');ab.classList.toggle('on',audioOn);ab.innerHTML=ic(audioOn?'vol':'mute',16)+(audioOn?' 语音播报：开':' 语音播报：关');
}
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='bForm'){A.bSend();render()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;A[el.dataset.a](el.dataset.v);render()});
S=fresh();render();
</script>
